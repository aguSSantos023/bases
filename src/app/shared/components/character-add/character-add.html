<h3>Agregar: {{ name() }}</h3>

<input type="text" class="form-control" placeholder="Nombre" [value]="name()" (input)="name.set(textName.value)"
  #textName>

<input type="number" class="form-control mt-2" placeholder="Poder" [value]="power()"
  (input)="power.set(+numberPower.value)" #numberPower>

<button class="mt-2 btn btn-primary" (click)="addCharacter()">
  Agregar
</button>
